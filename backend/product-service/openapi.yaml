openapi: 3.1.0
info:
  title: Product Service
  description: Katalog izdelkov in kategorij (docs/03 §6). Poti imajo predpono `/v1`,
    gateway jih izpostavi kot `/api/v1/...`. Dovoljeni klicatelji so v `x-callers`.
  version: 1.0.0
servers:
- url: /
  description: Service-relative; paths already include `/v1`.
paths:
  /v1/categories:
    get:
      tags:
      - Categories
      summary: List Categories
      description: Seznam kategorij, razvrščen po imenu.
      operationId: list_categories_v1_categories_get
      security:
      - ServiceToken: []
      - OperatorId: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Q
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_CategoryOut_'
        '400':
          description: '`BAD_REQUEST`: unreadable JSON, bad parameter or malformed
            UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: '`UNAUTHENTICATED`: missing or invalid service token or operator
            identity.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: '`CALLER_NOT_ALLOWED`: the caller may not use this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: '`VALIDATION_ERROR` with `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '500':
          description: '`INTERNAL_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: '`DEPENDENCY_UNAVAILABLE`: the database or a dependency does
            not answer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      x-callers:
      - OPERATOR
      - frontend-api
    post:
      tags:
      - Categories
      summary: Create Category
      description: 'Ni idempotentno: vsak klic ustvari novo kategorijo.'
      operationId: create_category_v1_categories_post
      security:
      - ServiceToken: []
      - OperatorId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryOut'
        '400':
          description: '`BAD_REQUEST`: unreadable JSON, bad parameter or malformed
            UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: '`UNAUTHENTICATED`: missing or invalid service token or operator
            identity.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: '`CALLER_NOT_ALLOWED`: the caller may not use this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: '`VALIDATION_ERROR` with `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '500':
          description: '`INTERNAL_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: '`DEPENDENCY_UNAVAILABLE`: the database or a dependency does
            not answer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: '`CATEGORY_NAME_TAKEN`: another category already has this name.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      x-callers:
      - OPERATOR
  /v1/categories/{category_id}:
    get:
      tags:
      - Categories
      summary: Get Category
      operationId: get_category_v1_categories__category_id__get
      security:
      - ServiceToken: []
      - OperatorId: []
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Category Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryOut'
        '400':
          description: '`BAD_REQUEST`: unreadable JSON, bad parameter or malformed
            UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: '`UNAUTHENTICATED`: missing or invalid service token or operator
            identity.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: '`CALLER_NOT_ALLOWED`: the caller may not use this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: '`VALIDATION_ERROR` with `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '500':
          description: '`INTERNAL_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: '`DEPENDENCY_UNAVAILABLE`: the database or a dependency does
            not answer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: '`CATEGORY_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      x-callers:
      - OPERATOR
      - frontend-api
    put:
      tags:
      - Categories
      summary: Replace Category
      description: Idempotentna zamenjava imena in opisa.
      operationId: replace_category_v1_categories__category_id__put
      security:
      - ServiceToken: []
      - OperatorId: []
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Category Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryOut'
        '400':
          description: '`BAD_REQUEST`: unreadable JSON, bad parameter or malformed
            UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: '`UNAUTHENTICATED`: missing or invalid service token or operator
            identity.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: '`CALLER_NOT_ALLOWED`: the caller may not use this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: '`VALIDATION_ERROR` with `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '500':
          description: '`INTERNAL_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: '`DEPENDENCY_UNAVAILABLE`: the database or a dependency does
            not answer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: '`CATEGORY_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: '`CATEGORY_NAME_TAKEN`: another category already has this name.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      x-callers:
      - OPERATOR
    delete:
      tags:
      - Categories
      summary: Delete Category
      description: Trajen izbris, samo če je ne uporablja noben izdelek; ponovitev
        vrne 404.
      operationId: delete_category_v1_categories__category_id__delete
      security:
      - ServiceToken: []
      - OperatorId: []
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Category Id
      responses:
        '204':
          description: Successful Response
        '400':
          description: '`BAD_REQUEST`: unreadable JSON, bad parameter or malformed
            UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: '`UNAUTHENTICATED`: missing or invalid service token or operator
            identity.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: '`CALLER_NOT_ALLOWED`: the caller may not use this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: '`VALIDATION_ERROR` with `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '500':
          description: '`INTERNAL_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: '`DEPENDENCY_UNAVAILABLE`: the database or a dependency does
            not answer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: '`CATEGORY_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: '`CATEGORY_IN_USE`: a product (also archived) uses this category.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      x-callers:
      - OPERATOR
  /v1/products:
    get:
      tags:
      - Products
      summary: List Products
      description: Seznam izdelkov, razvrščen po nazivu; privzeto samo aktivni.
      operationId: list_products_v1_products_get
      security:
      - ServiceToken: []
      - OperatorId: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Q
      - name: categoryId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Categoryid
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ProductStatus'
          default: ACTIVE
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ProductOut_'
        '400':
          description: '`BAD_REQUEST`: unreadable JSON, bad parameter or malformed
            UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: '`UNAUTHENTICATED`: missing or invalid service token or operator
            identity.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: '`CALLER_NOT_ALLOWED`: the caller may not use this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: '`VALIDATION_ERROR` with `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '500':
          description: '`INTERNAL_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: '`DEPENDENCY_UNAVAILABLE`: the database or a dependency does
            not answer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      x-callers:
      - OPERATOR
      - frontend-api
      - inventory
      - sales
    post:
      tags:
      - Products
      summary: Create Product
      description: Ni idempotentno; nazivi izdelkov se lahko ponavljajo.
      operationId: create_product_v1_products_post
      security:
      - ServiceToken: []
      - OperatorId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductOut'
        '400':
          description: '`BAD_REQUEST`: unreadable JSON, bad parameter or malformed
            UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: '`UNAUTHENTICATED`: missing or invalid service token or operator
            identity.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: '`CALLER_NOT_ALLOWED`: the caller may not use this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: '`VALIDATION_ERROR` or `REFERENCE_NOT_FOUND` (unknown category).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '500':
          description: '`INTERNAL_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: '`DEPENDENCY_UNAVAILABLE`: the database or a dependency does
            not answer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      x-callers:
      - OPERATOR
  /v1/products/{product_id}:
    get:
      tags:
      - Products
      summary: Get Product
      description: Vrne tudi arhiviran izdelek (naziv za pretekle prodaje in alarme).
      operationId: get_product_v1_products__product_id__get
      security:
      - ServiceToken: []
      - OperatorId: []
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Product Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductOut'
        '400':
          description: '`BAD_REQUEST`: unreadable JSON, bad parameter or malformed
            UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: '`UNAUTHENTICATED`: missing or invalid service token or operator
            identity.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: '`CALLER_NOT_ALLOWED`: the caller may not use this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: '`VALIDATION_ERROR` with `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '500':
          description: '`INTERNAL_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: '`DEPENDENCY_UNAVAILABLE`: the database or a dependency does
            not answer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: '`PRODUCT_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      x-callers:
      - OPERATOR
      - frontend-api
      - inventory
      - sales
      - monitoring
    put:
      tags:
      - Products
      summary: Replace Product
      description: Idempotentna zamenjava; nova cena ne spremeni že zabeleženih prodaj.
      operationId: replace_product_v1_products__product_id__put
      security:
      - ServiceToken: []
      - OperatorId: []
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Product Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductOut'
        '400':
          description: '`BAD_REQUEST`: unreadable JSON, bad parameter or malformed
            UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: '`UNAUTHENTICATED`: missing or invalid service token or operator
            identity.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: '`CALLER_NOT_ALLOWED`: the caller may not use this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: '`VALIDATION_ERROR` or `REFERENCE_NOT_FOUND` (unknown category).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '500':
          description: '`INTERNAL_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: '`DEPENDENCY_UNAVAILABLE`: the database or a dependency does
            not answer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: '`PRODUCT_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: '`PRODUCT_ARCHIVED`: an archived product cannot be changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      x-callers:
      - OPERATOR
    delete:
      tags:
      - Products
      summary: Archive Product
      description: Arhivacija (logični izbris). Pred tem Product vpraša Sales za odprte
        uskladitve.
      operationId: archive_product_v1_products__product_id__delete
      security:
      - ServiceToken: []
      - OperatorId: []
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Product Id
      responses:
        '204':
          description: Successful Response
        '400':
          description: '`BAD_REQUEST`: unreadable JSON, bad parameter or malformed
            UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: '`UNAUTHENTICATED`: missing or invalid service token or operator
            identity.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: '`CALLER_NOT_ALLOWED`: the caller may not use this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: '`VALIDATION_ERROR` with `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '500':
          description: '`INTERNAL_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: '`DEPENDENCY_UNAVAILABLE`: the database or a dependency does
            not answer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: '`PRODUCT_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: '`PRODUCT_HAS_OPEN_RECONCILIATION`: a sale still needs reconciliation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      x-callers:
      - OPERATOR
components:
  schemas:
    CategoryIn:
      properties:
        name:
          type: string
          maxLength: 60
          minLength: 1
          title: Name
        description:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Description
      additionalProperties: false
      type: object
      required:
      - name
      title: CategoryIn
    CategoryOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      type: object
      required:
      - id
      - name
      - description
      title: CategoryOut
    ErrorDetail:
      properties:
        field:
          type: string
          title: Field
        issue:
          type: string
          title: Issue
      type: object
      required:
      - field
      - issue
      title: ErrorDetail
    ErrorOut:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        traceId:
          type: string
          title: Traceid
        details:
          anyOf:
          - items:
              $ref: '#/components/schemas/ErrorDetail'
            type: array
          - type: 'null'
          title: Details
      type: object
      required:
      - code
      - message
      - traceId
      title: ErrorOut
      description: Telo napake, kot ga opisuje OpenAPI.
    Page_CategoryOut_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CategoryOut'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
      type: object
      required:
      - items
      - total
      - limit
      - offset
      title: Page[CategoryOut]
    Page_ProductOut_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ProductOut'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
      type: object
      required:
      - items
      - total
      - limit
      - offset
      title: Page[ProductOut]
    ProductIn:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
        categoryId:
          type: string
          format: uuid
          title: Categoryid
        referencePrice:
          type: string
          pattern: ^\d{1,10}(\.\d{1,2})?$
          title: Referenceprice
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          title: Currency
        weightGrams:
          type: integer
          maximum: 100000.0
          minimum: 1.0
          title: Weightgrams
        allergens:
          items:
            type: string
            maxLength: 50
            minLength: 1
          type: array
          maxItems: 20
          title: Allergens
        imageUrl:
          type: string
          maxLength: 500
          minLength: 1
          format: uri
          title: Imageurl
      additionalProperties: false
      type: object
      required:
      - name
      - categoryId
      - referencePrice
      - currency
      - weightGrams
      - allergens
      - imageUrl
      title: ProductIn
      description: Telo za ustvarjanje in zamenjavo izdelka; vsa polja so obvezna,
        `sku` ne obstaja.
    ProductOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        categoryId:
          type: string
          format: uuid
          title: Categoryid
        categoryName:
