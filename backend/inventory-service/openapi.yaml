openapi: 3.1.0
info:
  title: Inventory Service
  description: Zaloga v predalih avtomatov (docs/03 §7). Poti imajo predpono `/v1`,
    gateway jih izpostavi kot `/api/v1/...`. Dovoljeni klicatelji so v `x-callers`.
    Statične poti (`movements`, `refill`, `expired`, `product/...`) so registrirane
    pred potmi z `{machine_id}`.
  version: 1.0.0
servers:
- url: /
  description: Service-relative; paths already include `/v1`.
paths:
  /v1/inventory/product/{product_id}:
    get:
      tags:
      - Stock
      summary: List Product Stock
      description: Predali z izdelkom v vseh avtomatih (UI jih prikaže pred arhiviranjem
        izdelka).
      operationId: list_product_stock_v1_inventory_product__product_id__get
      security:
      - ServiceToken: []
      - OperatorId: []
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Product Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_SlotOut_'
        '400':
          description: '`BAD_REQUEST`: unreadable JSON, bad parameter or malformed
            UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: '`UNAUTHENTICATED`: missing or invalid service token or operator
            identity.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: '`CALLER_NOT_ALLOWED`: the caller may not use this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: '`VALIDATION_ERROR` with `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '500':
          description: '`INTERNAL_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: '`DEPENDENCY_UNAVAILABLE`: the database or a dependency does
            not answer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      x-callers:
      - OPERATOR
      - frontend-api
  /v1/inventory/refill:
    post:
      tags:
      - Stock
      summary: Refill Slot
      description: Polnitev predala (premik REFILL); idempotentno po refillId. Vrne
        predal po polnitvi.
      operationId: refill_slot_v1_inventory_refill_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefillIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotOut'
        '400':
          description: '`BAD_REQUEST`: unreadable JSON, bad parameter or malformed
            UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: '`UNAUTHENTICATED`: missing or invalid service token or operator
            identity.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: '`CALLER_NOT_ALLOWED`: the caller may not use this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: '`VALIDATION_ERROR` (also an expired batch or more than 1000
            items) or `REFERENCE_NOT_FOUND` (unknown product).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '500':
          description: '`INTERNAL_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: '`DEPENDENCY_UNAVAILABLE`: the database or a dependency does
            not answer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '200':
          description: Repeated refill; the quantity is not added again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotOut'
        '404':
          description: '`MACHINE_NOT_FOUND` or `SLOT_NOT_FOUND` (the machine has no
            such slot).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: '`REFILL_ID_CONFLICT`, `SLOT_HAS_OTHER_BATCH`, `PRODUCT_ARCHIVED`
            or `MACHINE_RETIRED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      security:
      - ServiceToken: []
      - OperatorId: []
      x-callers:
      - OPERATOR
  /v1/inventory/movements:
    get:
      tags:
      - Stock
      summary: List Movements
      description: Premiki zaloge, najnovejši najprej; `from` je vključen, `to` ne.
      operationId: list_movements_v1_inventory_movements_get
      security:
      - ServiceToken: []
      - OperatorId: []
      parameters:
      - name: machineId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Machineid
      - name: productId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Productid
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/MovementType'
          - type: 'null'
          title: Type
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: From
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: To
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_MovementOut_'
        '400':
          description: '`BAD_REQUEST`: unreadable JSON, bad parameter or malformed
            UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: '`UNAUTHENTICATED`: missing or invalid service token or operator
            identity.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: '`CALLER_NOT_ALLOWED`: the caller may not use this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: '`VALIDATION_ERROR` with `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '500':
          description: '`INTERNAL_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: '`DEPENDENCY_UNAVAILABLE`: the database or a dependency does
            not answer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      x-callers:
      - OPERATOR
  /v1/inventory/expired:
    delete:
      tags:
      - Stock
      summary: Remove Expired
      description: Izprazni predale avtomata s poteklo zalogo (B4), po en premik REMOVAL
        na predal.
      operationId: remove_expired_v1_inventory_expired_delete
      security:
      - ServiceToken: []
      - OperatorId: []
      parameters:
      - name: machineId
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Machineid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpiredOut'
        '400':
          description: '`BAD_REQUEST`: unreadable JSON, bad parameter or malformed
            UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: '`UNAUTHENTICATED`: missing or invalid service token or operator
            identity.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: '`CALLER_NOT_ALLOWED`: the caller may not use this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: '`VALIDATION_ERROR` with `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '500':
          description: '`INTERNAL_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: '`DEPENDENCY_UNAVAILABLE`: the database or a dependency does
            not answer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: '`MACHINE_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      x-callers:
      - OPERATOR
  /v1/inventory/{machine_id}:
    get:
      tags:
      - Stock
      summary: List Machine Stock
      description: 'Zaloga avtomata po predalih.


        Druge storitve dobijo odgovor brez klica v Machine (neznan avtomat: prazen
        seznam);

        za operaterja Inventory prej preveri avtomat (neznan: 404).'
      operationId: list_machine_stock_v1_inventory__machine_id__get
      security:
      - ServiceToken: []
      - OperatorId: []
      parameters:
      - name: machine_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Machine Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_SlotOut_'
        '400':
          description: '`BAD_REQUEST`: unreadable JSON, bad parameter or malformed
            UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: '`UNAUTHENTICATED`: missing or invalid service token or operator
            identity.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: '`CALLER_NOT_ALLOWED`: the caller may not use this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: '`VALIDATION_ERROR` with `details`.'
          content:
