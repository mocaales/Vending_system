        '503':
          description: '`DEPENDENCY_UNAVAILABLE`: the database or a dependency does
            not answer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: '`SLOT_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      x-callers:
