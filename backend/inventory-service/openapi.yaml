      - frontend-api
      - machine
  /v1/inventory/{machine_id}/{slot}:
    get:
      tags:
      - Stock
      summary: Get Slot
      description: 'Izpraznjen predal se vrne brez izdelka; nikoli nastavljen predal:
        404.'
      operationId: get_slot_v1_inventory__machine_id___slot__get
      security:
      - ServiceToken: []
      - OperatorId: []
      parameters:
      - name: machine_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Machine Id
      - name: slot
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 8
          title: Slot
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotOut'
        '400':
          description: '`BAD_REQUEST`: unreadable JSON, bad parameter or malformed
