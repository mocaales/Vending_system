                $ref: '#/components/schemas/ErrorOut'
        '500':
          description: '`INTERNAL_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: '`DEPENDENCY_UNAVAILABLE`: the database or a dependency does
            not answer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: '`SLOT_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      x-callers:
      - OPERATOR
      - frontend-api
      - sales
    put:
      tags:
      - Stock
      summary: Set Slot
      description: Nastavi predal (premik SET); idempotentno. Prej preveri avtomat
        v Machine in izdelek.
      operationId: set_slot_v1_inventory__machine_id___slot__put
      security:
      - ServiceToken: []
      - OperatorId: []
      parameters:
      - name: machine_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Machine Id
      - name: slot
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 8
          title: Slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotSet'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotOut'
        '400':
          description: '`BAD_REQUEST`: unreadable JSON, bad parameter or malformed
            UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: '`UNAUTHENTICATED`: missing or invalid service token or operator
            identity.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: '`CALLER_NOT_ALLOWED`: the caller may not use this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: '`VALIDATION_ERROR` or `REFERENCE_NOT_FOUND` (unknown product).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '500':
          description: '`INTERNAL_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: '`DEPENDENCY_UNAVAILABLE`: the database or a dependency does
            not answer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: '`MACHINE_NOT_FOUND` or `SLOT_NOT_FOUND` (the machine has no
            such slot).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: '`SLOT_NOT_EMPTY`, `PRODUCT_ARCHIVED` or `MACHINE_RETIRED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      x-callers:
      - OPERATOR
    delete:
      tags:
      - Stock
      summary: Empty Slot
      description: 'Izprazni predal (premik REMOVAL); že prazen predal: 204 brez premika.'
      operationId: empty_slot_v1_inventory__machine_id___slot__delete
      security:
      - ServiceToken: []
      - OperatorId: []
      parameters:
      - name: machine_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Machine Id
      - name: slot
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 8
          title: Slot
      responses:
        '204':
          description: Successful Response
        '400':
          description: '`BAD_REQUEST`: unreadable JSON, bad parameter or malformed
            UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: '`UNAUTHENTICATED`: missing or invalid service token or operator
            identity.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: '`CALLER_NOT_ALLOWED`: the caller may not use this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: '`VALIDATION_ERROR` with `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '500':
          description: '`INTERNAL_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: '`DEPENDENCY_UNAVAILABLE`: the database or a dependency does
            not answer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: '`SLOT_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      x-callers:
      - OPERATOR
  /v1/inventory/{machine_id}/{slot}/threshold:
    put:
      tags:
