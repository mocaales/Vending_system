          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: '`CALLER_NOT_ALLOWED`: the caller may not use this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
