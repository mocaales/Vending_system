  /v1/inventory/{machine_id}/{slot}/decrease:
    post:
      tags:
      - Stock
      summary: Decrease Stock
      description: 'Samo interno: delavec outboxa Sales enkrat na saleId.


        Neskladje vrne 201 z NEEDS_RECONCILIATION; zaloga se takrat ne spremeni.

        Ponovitev z istim telesom vrne 200 s shranjenim rezultatom.'
      operationId: decrease_stock_v1_inventory__machine_id___slot__decrease_post
      security:
      - ServiceToken: []
      - OperatorId: []
      parameters:
      - name: machine_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Machine Id
      - name: slot
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 8
          title: Slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecreaseIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecreaseOut'
        '400':
          description: '`BAD_REQUEST`: unreadable JSON, bad parameter or malformed
            UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: '`UNAUTHENTICATED`: missing or invalid service token or operator
            identity.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: '`CALLER_NOT_ALLOWED`: the caller may not use this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: '`VALIDATION_ERROR` with `details`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '500':
          description: '`INTERNAL_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: '`DEPENDENCY_UNAVAILABLE`: the database or a dependency does
            not answer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '200':
          description: Repeated request; the stored result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecreaseOut'
        '404':
          description: '`SLOT_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: '`SALE_ID_CONFLICT`: the same `saleId` with a different body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      x-callers:
      - sales
components:
  schemas:
    DecreaseIn:
      properties:
        saleId:
          type: string
          format: uuid
          title: Saleid
        productId:
          type: string
          format: uuid
          title: Productid
        quantity:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Quantity
      additionalProperties: false
      type: object
