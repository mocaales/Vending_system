[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-service"
version = "1.0.0"
description = "Inventory Service: zaloga v predalih avtomatov (FastAPI)."
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.165",
    "uvicorn~=0.54",
    "sqlalchemy~=2.1",
    "psycopg[binary]~=3.3",
    "alembic~=1.20",
    "httpx~=0.28",
    "tzdata>=2026.6",  # časovni pas Europe/Ljubljana (Alpine in Windows ga nimata)
]

[project.optional-dependencies]
dev = [
    "pytest~=9.2",
    "testcontainers[postgres]~=4.15",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
