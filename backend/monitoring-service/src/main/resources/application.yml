server:
  port: 8000

spring:
  application:
    name: monitoring-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  task:
    scheduling:
      pool:
        size: 2
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  web:
    resources:
      add-mappings: false

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    enabled: false

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

monitoring:
  jobs:
    enabled: ${MONITORING_JOBS_ENABLED:true}
    interval: ${MONITORING_JOBS_INTERVAL:PT30S}
    initial-delay: PT30S

notification:
  mail:
    from: ${SMTP_FROM:alarmi@vending.local}
    to: ${ALERT_EMAIL_TO:}
  max-attempts: 8
  base-delay: PT30S
  interval: PT10S

product-client:
  base-url: ${PRODUCT_URL:http://localhost:8002}

machine:
  base-url: ${MACHINE_URL:http://localhost:8001}

core:
  service-tokens:
    gateway: ${GATEWAY_SERVICE_TOKEN:}
    monitoring: ${MONITORING_SERVICE_TOKEN:}
    sales: ${SALES_SERVICE_TOKEN:}
    inventory: ${INVENTORY_SERVICE_TOKEN:}
    product: ${PRODUCT_SERVICE_TOKEN:}
