openapi: 3.1.0
info:
  title: Sales Service API
  version: 1.0.0
  description: |
    Sales events from vending machines, their reconciliation with stock, statistics and daily closings.
    Contract source: docs/03-api-pogodbe.md sections 3.1 and 8 (conventions in sections 1 and 2).

    Conventions:
    - All paths carry the service prefix `/v1`; the gateway exposes them as `/api/v1/...`.
      A machine posts a sale at the gateway as `POST /api/v1/device/sales`; the gateway verifies the
      machine key and forwards it with `X-Machine-Id`.
    - IDs are UUIDs, money is a decimal string (`"2.50"`), timestamps are ISO-8601 UTC with `Z`,
      dates are `YYYY-MM-DD` (UTC), enums are UPPER_SNAKE.
    - Request bodies reject unknown fields with 422 `VALIDATION_ERROR`.
    - Lists return `{items, total, limit, offset}`; `limit` defaults to 50 (max 200).
    - Every operation can also return 400, 500, 503 and 504; every operation is authenticated
      (401, 403); 422 applies where a body or parameter exists. These are shared responses.
    - Each operation lists its allowed callers in `x-callers`. A caller outside that list gets
      403 `CALLER_NOT_ALLOWED`.
    - Static paths (`/v1/sales/stats`, `/v1/sales/closings`) are distinct from `/v1/sales/{saleId}`
      and are matched first; `stats` and `closings` are never sale ids.
    - A sale is immutable. Only its reconciliation state changes
      (`PENDING`, `APPLIED`, `NEEDS_RECONCILIATION`, `RESOLVED`); the only manual transition is
      `NEEDS_RECONCILIATION` to `RESOLVED` (terminal). Sales never changes stock.
servers:
  - url: /
    description: Service-relative; paths already include the `/v1` prefix.
tags:
  - name: Sales
    description: Recording and reading sales.
  - name: Statistics
    description: Aggregated sales figures.
  - name: Reconciliation
    description: Closing a stock mismatch of a sale.
  - name: Closings
    description: Daily closings, a snapshot of one day's sales.
security:
  - OperatorId: []
paths:
  /v1/sales:
    post:
      tags: [Sales]
      operationId: recordSale
      summary: Record a sale
      description: |
        Called by a machine through the gateway. Idempotent by `saleId`: the same content again
        returns 200 with the existing result; the same `saleId` with a different body returns 409
        `SALE_ID_CONFLICT`. `machineId` must match the authenticated machine (`X-Machine-Id`),
        otherwise 403 `MACHINE_KEY_MISMATCH`.

        `X-Machine-Id` counts only together with the gateway's `X-Service-Token`. Without it, or
        when it is blank, the request is 403 `CALLER_NOT_ALLOWED` (an `X-Operator-Id` instead does
        not help). A value that is not a UUID, both `X-Machine-Id` and `X-Operator-Id`, or an
        identity header sent more than once (also as a comma-joined list) is 401 `UNAUTHENTICATED`.
        These checks run before any other work; a rejected request stores nothing.

        On receipt Sales checks the product (Product) and the slot (Inventory); an unknown one is
        422 `REFERENCE_NOT_FOUND`. `occurredAt` more than 5 minutes in the future is 422
        `TIMESTAMP_OUT_OF_RANGE`. If Product or Inventory does not answer, the response is 503, nothing
        is stored and the simulator repeats the request with the same `saleId`.

        The stock decrease happens afterwards, once per `saleId`, through an outbox; the sale starts
        in reconciliation state `PENDING`.
      x-callers: [MACHINE]
      security:
        - MachineId: []
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleEvent'
      responses:
        '201':
          description: Sale accepted and stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleOut'
        '200':
          description: Same `saleId` and same content seen before; the existing result is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleOut'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: '`UNAUTHENTICATED`: missing or invalid service token, or a malformed or ambiguous machine identity.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: '`MACHINE_KEY_MISMATCH` (the key belongs to another machine than `machineId`) or `CALLER_NOT_ALLOWED` (not the gateway acting for a machine).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: '`SALE_ID_CONFLICT`: the `saleId` exists with different content.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: '`VALIDATION_ERROR` (with `details`), `REFERENCE_NOT_FOUND` (unknown product or slot) or `TIMESTAMP_OUT_OF_RANGE` (`occurredAt` more than 5 minutes in the future).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
        '504': {$ref: '#/components/responses/UpstreamTimeout'}
    get:
      tags: [Sales]
      operationId: listSales
      summary: List sales
      description: |
        Newest `occurredAt` first. `from` is inclusive and `to` is exclusive. Product calls this with
        `productId`, `reconciliation=NEEDS_RECONCILIATION` and `limit=1` before archiving a product.
      x-callers: [OPERATOR, frontend-api, product]
      security:
        - OperatorId: []
        - ServiceToken: []
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - name: machineId
          in: query
          description: Only sales of this machine.
          schema: {type: string, format: uuid}
        - name: productId
          in: query
          description: Only sales of this product.
          schema: {type: string, format: uuid}
        - name: from
          in: query
          description: Only sales with `occurredAt` at or after this time.
          schema: {type: string, format: date-time}
        - name: to
          in: query
          description: Only sales with `occurredAt` before this time.
          schema: {type: string, format: date-time}
        - name: reconciliation
          in: query
          description: Only sales in this reconciliation state.
          schema: {$ref: '#/components/schemas/ReconciliationState'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Page of sales.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaleList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
        '504': {$ref: '#/components/responses/UpstreamTimeout'}
  /v1/sales/stats:
    get:
      tags: [Statistics]
      operationId: getSalesStats
      summary: Sales statistics over all machines
      description: |
        Static path, distinct from `/v1/sales/{saleId}`. Totals are grouped by currency; `topProducts`
        holds the best-selling products by quantity, at most `top`.
      x-callers: [OPERATOR, frontend-api]
      security:
        - OperatorId: []
        - ServiceToken: []
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/StatsFrom'
        - $ref: '#/components/parameters/StatsTo'
        - $ref: '#/components/parameters/Top'
      responses:
        '200':
          description: Aggregated figures.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SalesStatsOut'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
        '504': {$ref: '#/components/responses/UpstreamTimeout'}
  /v1/sales/stats/{machineId}:
    get:
      tags: [Statistics]
      operationId: getMachineSalesStats
      summary: Sales statistics of one machine
      description: |
        Static prefix `stats`, distinct from `/v1/sales/{saleId}`. A machine without sales returns
        empty `totals` and `topProducts`.
      x-callers: [OPERATOR, frontend-api]
      security:
        - OperatorId: []
        - ServiceToken: []
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - name: machineId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/StatsFrom'
        - $ref: '#/components/parameters/StatsTo'
        - $ref: '#/components/parameters/Top'
      responses:
        '200':
          description: Aggregated figures of the machine.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SalesStatsOut'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
        '504': {$ref: '#/components/responses/UpstreamTimeout'}
  /v1/sales/{saleId}:
    get:
      tags: [Sales]
      operationId: getSale
      summary: Get a sale
      description: Includes the reconciliation state and, once closed, the reconciliation record.
      x-callers: [OPERATOR, frontend-api]
      security:
        - OperatorId: []
        - ServiceToken: []
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/SaleId'
      responses:
        '200':
          description: The sale.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaleOut'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/SaleNotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
        '504': {$ref: '#/components/responses/UpstreamTimeout'}
  /v1/sales/{saleId}/reconciliation:
    put:
      tags: [Reconciliation]
      operationId: resolveReconciliation
      summary: Close a stock mismatch
      description: |
        Moves a sale from `NEEDS_RECONCILIATION` to `RESOLVED` (terminal) with a resolution and note.
        Sales does not change stock; `ADJUSTED` records that the operator already corrected stock in
        Inventory. The same body on an already resolved sale returns 200 without change; a different
        body, or a sale in any other state, returns 409 `INVALID_STATE_TRANSITION`.
      x-callers: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/SaleId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReconciliationIn'}
      responses:
        '200':
          description: The sale with its reconciliation record.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaleOut'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/SaleNotFound'}
        '409':
          description: '`INVALID_STATE_TRANSITION`: the sale is not `NEEDS_RECONCILIATION`, or it is resolved with a different body.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
        '504': {$ref: '#/components/responses/UpstreamTimeout'}
  /v1/sales/closings:
    post:
      tags: [Closings]
      operationId: createClosing
      summary: Create a daily closing
      description: |
        Static path, distinct from `/v1/sales/{saleId}`. Not idempotent. Creates a `DRAFT` closing with
        totals computed from the sales whose `occurredAt` falls in the UTC day `date`. `date` must be a
        UTC day before today. Without `machineId` the closing covers all machines. There is one closing
        per (`date`, `machineId`). Sales does not call Machine: a closing for a `machineId` with no
        sales has zero totals, consistent with `GET /v1/sales/stats/{machineId}` returning empty totals.
      x-callers: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClosingIn'}
      responses:
        '201':
          description: Draft closing created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClosingOut'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: '`CLOSING_EXISTS`: a closing for this date and scope already exists.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
        '504': {$ref: '#/components/responses/UpstreamTimeout'}
    get:
      tags: [Closings]
      operationId: listClosings
      summary: List daily closings
      description: Static path, distinct from `/v1/sales/{saleId}`. Newest `date` first. `from` and `to` are inclusive dates.
      x-callers: [OPERATOR, frontend-api]
      security:
        - OperatorId: []
        - ServiceToken: []
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - name: from
          in: query
          description: Closings with `date` on or after this date.
          schema: {type: string, format: date}
        - name: to
          in: query
          description: Closings with `date` on or before this date.
          schema: {type: string, format: date}
        - name: machineId
          in: query
          description: Only closings of this machine.
          schema: {type: string, format: uuid}
        - name: status
          in: query
          description: Only closings in this status.
          schema: {$ref: '#/components/schemas/ClosingStatus'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Page of closings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClosingList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
        '504': {$ref: '#/components/responses/UpstreamTimeout'}
    delete:
      tags: [Closings]
      operationId: deleteClosingsByDate
      summary: Delete all draft closings of a day
      description: |
        Static path, distinct from `/v1/sales/{saleId}`. Permanently deletes every `DRAFT` closing of
        `date` (all scopes); confirmed closings are skipped. Repeating the call returns 200 with
        `deleted: 0`.
      x-callers: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - name: date
          in: query
          required: true
          description: UTC day whose drafts are deleted.
          schema: {type: string, format: date}
      responses:
        '200':
          description: Number of deleted drafts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClosingsDeleted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
        '504': {$ref: '#/components/responses/UpstreamTimeout'}
  /v1/sales/closings/{id}:
    parameters:
      - $ref: '#/components/parameters/TraceId'
      - $ref: '#/components/parameters/ClosingId'
    get:
      tags: [Closings]
      operationId: getClosing
      summary: Get a daily closing
      x-callers: [OPERATOR, frontend-api]
      security:
        - OperatorId: []
        - ServiceToken: []
      responses:
        '200':
          description: The closing.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClosingOut'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ClosingNotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
        '504': {$ref: '#/components/responses/UpstreamTimeout'}
    put:
      tags: [Closings]
      operationId: updateClosing
      summary: Recompute or confirm a closing
      description: |
        On a `DRAFT` closing with `status: DRAFT` it replaces the note and recomputes the totals.
        With `status: CONFIRMED` it confirms the closing (terminal) after a last recomputation;
        confirming requires `openReconciliations` to be 0. The same body on a confirmed closing
        returns 200 without change; any other change to a confirmed closing is 409 `CLOSING_CONFIRMED`.
        Later sales never change confirmed totals.
      x-callers: [OPERATOR]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClosingUpdate'}
      responses:
        '200':
          description: The closing after the update.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClosingOut'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ClosingNotFound'}
        '409':
          description: '`CLOSING_CONFIRMED` (the closing is confirmed and the body differs) or `CLOSING_HAS_OPEN_RECONCILIATION` (confirmation while sales in scope still need reconciliation).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
        '504': {$ref: '#/components/responses/UpstreamTimeout'}
    delete:
      tags: [Closings]
      operationId: deleteClosing
      summary: Delete a draft closing
      description: Permanent deletion, only for `DRAFT`. Repeating the call returns 404 `CLOSING_NOT_FOUND`.
      x-callers: [OPERATOR]
      responses:
        '204':
          description: Draft deleted.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/ClosingNotFound'}
        '409':
          description: '`CLOSING_CONFIRMED`: a confirmed closing cannot be deleted.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
        '504': {$ref: '#/components/responses/UpstreamTimeout'}
components:
  securitySchemes:
    OperatorId:
      type: apiKey
      in: header
      name: X-Operator-Id
      description: Set by the gateway after verifying the operator JWT; any client-sent value is stripped there.
    ServiceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: Internal token of the calling component (one per component, from the environment).
    MachineId:
      type: apiKey
      in: header
      name: X-Machine-Id
      description: Set by the gateway after verifying the `X-Machine-Key` of the machine; any client-sent value is stripped there.
  parameters:
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: Trace id created at the gateway and propagated between services.
      schema: {type: string}
    SaleId:
      name: saleId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ClosingId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    StatsFrom:
      name: from
      in: query
      description: Count sales with `occurredAt` at or after this time.
      schema: {type: string, format: date-time}
    StatsTo:
      name: to
      in: query
      description: Count sales with `occurredAt` before this time.
      schema: {type: string, format: date-time}
    Top:
      name: top
      in: query
      description: Maximum number of entries in `topProducts`.
      schema: {type: integer, minimum: 1, maximum: 20, default: 5}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
  responses:
    BadRequest:
      description: '`BAD_REQUEST`: unreadable JSON, bad parameter or malformed UUID.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthenticated:
      description: '`UNAUTHENTICATED`: missing, invalid or revoked token or key.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: '`FORBIDDEN` or `CALLER_NOT_ALLOWED`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SaleNotFound:
      description: '`SALE_NOT_FOUND`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ClosingNotFound:
      description: '`CLOSING_NOT_FOUND`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ValidationError:
      description: '`VALIDATION_ERROR` with `details`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: '`INTERNAL_ERROR`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    DependencyUnavailable:
      description: '`DEPENDENCY_UNAVAILABLE`: a dependency (for example Product, Inventory or Machine) does not answer; the client retries.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UpstreamTimeout:
      description: '`UPSTREAM_TIMEOUT`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
          description: Machine-readable code, for example `SALE_ID_CONFLICT`.
          examples: [SALE_ID_CONFLICT]
        message:
          type: string
          description: Short English text; the UI maps `code` to Slovenian.
        traceId:
          type: string
        details:
          type: array
          description: Only for `VALIDATION_ERROR`.
          items: {$ref: '#/components/schemas/ValidationErrorDetail'}
    ValidationErrorDetail:
      type: object
      required: [field, issue]
      properties:
        field: {type: string, examples: [quantity]}
        issue: {type: string, examples: ['must be >= 1']}
    Money:
      type: string
      pattern: '^\d{1,10}(\.\d{1,2})?$'
      description: Non-negative decimal string, at most 2 decimals.
      examples: ['2.50']
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: ISO 4217 code; `EUR` in the prototype.
      examples: [EUR]
    PaymentMethod:
      type: string
      enum: [CASH, CARD, OTHER]
      description: Informational only.
    ReconciliationState:
      type: string
      enum: [PENDING, APPLIED, NEEDS_RECONCILIATION, RESOLVED]
      description: |
        `PENDING`: stock decrease not yet confirmed (also while retried after a network failure).
        `APPLIED`: Inventory applied the decrease.
        `NEEDS_RECONCILIATION`: mismatch between sale and stock.
        `RESOLVED`: closed by an operator (terminal).
    ReconciliationResolution:
      type: string
      enum: [ADJUSTED, WRITTEN_OFF]
      description: '`ADJUSTED`: stock was corrected in Inventory. `WRITTEN_OFF`: the difference is accepted without a correction.'
    ClosingStatus:
      type: string
      enum: [DRAFT, CONFIRMED]
      description: '`CONFIRMED` is terminal.'
    SaleEvent:
      type: object
      description: |
        A sale sent by a machine. All fields are required. `saleId` is created by the simulator and kept
        until acceptance is confirmed. `slotId` carries the `slotCode` of the slot.
      required: [saleId, machineId, slotId, productId, quantity, unitPricePaid, currency, paymentMethod, occurredAt]
      properties:
        saleId: {type: string, format: uuid}
        machineId: {type: string, format: uuid}
        slotId:
          type: string
          minLength: 1
          maxLength: 8
          pattern: '^[A-Za-z0-9_-]{1,8}$'
          description: '`slotCode` of the slot, for example `A1`.'
        productId: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 100}
        unitPricePaid: {$ref: '#/components/schemas/Money'}
        currency: {$ref: '#/components/schemas/Currency'}
        paymentMethod: {$ref: '#/components/schemas/PaymentMethod'}
        occurredAt: {type: string, format: date-time, description: UTC time of the sale. Not before `2020-01-01T00:00:00Z`; an earlier time is 422 `VALIDATION_ERROR`.}
      additionalProperties: false
      examples:
        - saleId: 6b1f0c2e-5a34-4d7e-9a10-2f6c1b7d8e01
          machineId: 0d9c4a52-3b1e-4f6a-8c27-91e5a7b3d410
          slotId: A1
          productId: c3a8f7d4-12ab-4e55-b6c9-5d0e8a1f2b73
          quantity: 1
          unitPricePaid: '2.50'
          currency: EUR
          paymentMethod: CARD
          occurredAt: '2026-11-17T08:30:00Z'
    InventoryResult:
      type: object
      required: [state]
      properties:
        state: {$ref: '#/components/schemas/ReconciliationState'}
        reason:
          type: ['string', 'null']
          enum: [PRODUCT_MISMATCH, INSUFFICIENT_STOCK, null]
          description: Why the sale needs reconciliation; null otherwise.
    ReconciliationRecord:
      type: object
      required: [resolution, note, resolvedAt, resolvedBy]
      properties:
        resolution: {$ref: '#/components/schemas/ReconciliationResolution'}
        note: {type: string, minLength: 1, maxLength: 500}
        resolvedAt: {type: string, format: date-time}
        resolvedBy: {type: string, format: uuid, description: Operator id.}
    SaleOut:
      type: object
      required: [saleId, machineId, slotId, productId, quantity, unitPricePaid, currency, paymentMethod, occurredAt, receivedAt, inventory]
      properties:
        saleId: {type: string, format: uuid}
        machineId: {type: string, format: uuid}
        slotId: {type: string, minLength: 1, maxLength: 8}
        productId: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 100}
        unitPricePaid: {$ref: '#/components/schemas/Money'}
        currency: {$ref: '#/components/schemas/Currency'}
        paymentMethod: {$ref: '#/components/schemas/PaymentMethod'}
        occurredAt: {type: string, format: date-time}
        receivedAt: {type: string, format: date-time, description: When Sales stored the sale.}
        inventory: {$ref: '#/components/schemas/InventoryResult'}
        reconciliation:
          description: Present only after an operator closed the mismatch.
          oneOf:
            - $ref: '#/components/schemas/ReconciliationRecord'
            - type: 'null'
    SaleList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SaleOut'}
        total: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 200}
        offset: {type: integer, minimum: 0}
    ReconciliationIn:
      type: object
      required: [resolution, note]
      properties:
        resolution: {$ref: '#/components/schemas/ReconciliationResolution'}
        note: {type: string, minLength: 1, maxLength: 500}
      additionalProperties: false
    Totals:
      type: object
      required: [currency, salesCount, quantity, turnover]
      properties:
        currency: {$ref: '#/components/schemas/Currency'}
        salesCount: {type: integer, minimum: 0}
        quantity: {type: integer, minimum: 0}
        turnover: {$ref: '#/components/schemas/Money'}
    TopProduct:
      type: object
      required: [productId, quantity, turnover]
      properties:
        productId: {type: string, format: uuid}
        quantity: {type: integer, minimum: 0}
        turnover:
          $ref: '#/components/schemas/Money'
    SalesStatsOut:
      type: object
      required: [totals, topProducts]
      properties:
        totals:
          type: array
          description: One entry per currency.
          items: {$ref: '#/components/schemas/Totals'}
        topProducts:
          type: array
          items: {$ref: '#/components/schemas/TopProduct'}
    ClosingIn:
      type: object
      required: [date]
      properties:
        date:
          type: string
          format: date
          description: UTC day, before today.
        machineId:
          type: string
          format: uuid
          description: Machine to close; omit for all machines.
        note: {type: string, maxLength: 500}
      additionalProperties: false
    ClosingUpdate:
      type: object
      required: [status]
      properties:
        note: {type: string, maxLength: 500}
        status: {$ref: '#/components/schemas/ClosingStatus'}
      additionalProperties: false
    ClosingOut:
      type: object
      required: [id, date, status, note, totals, openReconciliations, createdAt, createdBy, updatedAt]
      properties:
        id: {type: string, format: uuid}
        date: {type: string, format: date}
        machineId:
          type: ['string', 'null']
          format: uuid
          description: Null when the closing covers all machines.
        status: {$ref: '#/components/schemas/ClosingStatus'}
        note: {type: string, maxLength: 500}
        totals:
          type: array
          items: {$ref: '#/components/schemas/Totals'}
        openReconciliations:
          type: integer
          minimum: 0
          description: Sales in scope still in `NEEDS_RECONCILIATION`; confirming requires 0.
        createdAt: {type: string, format: date-time}
        createdBy: {type: string, format: uuid}
        updatedAt: {type: string, format: date-time}
        confirmedAt: {type: ['string', 'null'], format: date-time}
        confirmedBy: {type: ['string', 'null'], format: uuid}
    ClosingList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ClosingOut'}
        total: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 200}
        offset: {type: integer, minimum: 0}
    ClosingsDeleted:
      type: object
      required: [deleted]
      properties:
        deleted: {type: integer, minimum: 0}
