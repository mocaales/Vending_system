[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "simulator"
version = "1.0.0"
description = "Simulator avtomatov: prodaje in meritve prek gatewaya."
requires-python = ">=3.12"
dependencies = [
    "httpx~=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.2",
]

[tool.setuptools.packages.find]
include = ["simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
