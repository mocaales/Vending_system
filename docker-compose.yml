# Lokalni zagon: šest baz PostgreSQL (po ena na komponento) in Mailpit.
# Zabojnike komponent doda vsak ogrodni issue sam, v svojem PR (glej vzorec spodaj).
# Na računalniku sta objavljena samo gateway (8080, doda ga njegov issue) in Mailpit (8025);
# frontend (5173) doda svoj issue. Baze in storitve od zunaj niso dosegljive.
# Gesla pridejo iz .env (kopija .env.example); brez njih Compose ne zažene.
name: vending

services:
  machine-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: machine
      POSTGRES_USER: machine
      POSTGRES_PASSWORD: ${MACHINE_DB_PASSWORD:?Nastavi MACHINE_DB_PASSWORD v .env}
    volumes:
      - machine-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U machine -d machine"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  monitoring-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: monitoring
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: ${MONITORING_DB_PASSWORD:?Nastavi MONITORING_DB_PASSWORD v .env}
    volumes:
      - monitoring-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring -d monitoring"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  product-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: product
      POSTGRES_USER: product
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD:?Nastavi PRODUCT_DB_PASSWORD v .env}
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product -d product"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  inventory-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:?Nastavi INVENTORY_DB_PASSWORD v .env}
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  sales-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sales
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: ${SALES_DB_PASSWORD:?Nastavi SALES_DB_PASSWORD v .env}
    volumes:
      - sales-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  gateway-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${GATEWAY_DB_PASSWORD:?Nastavi GATEWAY_DB_PASSWORD v .env}
    volumes:
      - gateway-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  # Spletni vmesnik je na http://localhost:8025; SMTP (1025) je dosegljiv samo znotraj omrežja Compose.
  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    restart: unless-stopped

  # Machine Service (Java). Kličejo ga gateway, inventory in monitoring; zunaj omrežja Compose ni dosegljiv.
  machine-service:
    build: ./backend/machine-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://machine-db:5432/machine
      SPRING_DATASOURCE_USERNAME: machine
      SPRING_DATASOURCE_PASSWORD: ${MACHINE_DB_PASSWORD:?Nastavi MACHINE_DB_PASSWORD v .env}
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:?Nastavi GATEWAY_SERVICE_TOKEN v .env}
      INVENTORY_SERVICE_TOKEN: ${INVENTORY_SERVICE_TOKEN:?Nastavi INVENTORY_SERVICE_TOKEN v .env}
      MONITORING_SERVICE_TOKEN: ${MONITORING_SERVICE_TOKEN:?Nastavi MONITORING_SERVICE_TOKEN v .env}
      MACHINE_SERVICE_TOKEN: ${MACHINE_SERVICE_TOKEN:?Nastavi MACHINE_SERVICE_TOKEN v .env}
      INVENTORY_URL: http://inventory-service:8000
    depends_on:
      machine-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    restart: unless-stopped

  # Monitoring Service (Java). Kličeta ga gateway in inventory, sam kliče machine in inventory; zunaj omrežja Compose ni dosegljiv.
  monitoring-service:
    build: ./backend/monitoring-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://monitoring-db:5432/monitoring
      SPRING_DATASOURCE_USERNAME: monitoring
      SPRING_DATASOURCE_PASSWORD: ${MONITORING_DB_PASSWORD:?Nastavi MONITORING_DB_PASSWORD v .env}
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:?Nastavi GATEWAY_SERVICE_TOKEN v .env}
      INVENTORY_SERVICE_TOKEN: ${INVENTORY_SERVICE_TOKEN:?Nastavi INVENTORY_SERVICE_TOKEN v .env}
      MONITORING_SERVICE_TOKEN: ${MONITORING_SERVICE_TOKEN:?Nastavi MONITORING_SERVICE_TOKEN v .env}
      MACHINE_URL: http://machine-service:8000
    depends_on:
      monitoring-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    restart: unless-stopped

  # Sales Service (Java). Kličeta ga gateway in product, sam kliče inventory, machine in product; zunaj omrežja Compose ni dosegljiv.
  sales-service:
    build: ./backend/sales-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://sales-db:5432/sales
      SPRING_DATASOURCE_USERNAME: sales
      SPRING_DATASOURCE_PASSWORD: ${SALES_DB_PASSWORD:?Nastavi SALES_DB_PASSWORD v .env}
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:?Nastavi GATEWAY_SERVICE_TOKEN v .env}
      PRODUCT_SERVICE_TOKEN: ${PRODUCT_SERVICE_TOKEN:?Nastavi PRODUCT_SERVICE_TOKEN v .env}
      SALES_SERVICE_TOKEN: ${SALES_SERVICE_TOKEN:?Nastavi SALES_SERVICE_TOKEN v .env}
      PRODUCT_URL: http://product-service:8000
      INVENTORY_URL: http://inventory-service:8000
    depends_on:
      sales-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    restart: unless-stopped

  # Product Service (Python). Kličejo ga gateway, inventory, sales in monitoring, sam kliče sales; zunaj omrežja Compose ni dosegljiv.
  product-service:
    build: ./backend/product-service
    environment:
      DATABASE_URL: postgresql+psycopg://product:${PRODUCT_DB_PASSWORD:?Nastavi PRODUCT_DB_PASSWORD v .env}@product-db:5432/product
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:?Nastavi GATEWAY_SERVICE_TOKEN v .env}
      INVENTORY_SERVICE_TOKEN: ${INVENTORY_SERVICE_TOKEN:?Nastavi INVENTORY_SERVICE_TOKEN v .env}
      SALES_SERVICE_TOKEN: ${SALES_SERVICE_TOKEN:?Nastavi SALES_SERVICE_TOKEN v .env}
      MONITORING_SERVICE_TOKEN: ${MONITORING_SERVICE_TOKEN:?Nastavi MONITORING_SERVICE_TOKEN v .env}
      PRODUCT_SERVICE_TOKEN: ${PRODUCT_SERVICE_TOKEN:?Nastavi PRODUCT_SERVICE_TOKEN v .env}
      SALES_URL: http://sales-service:8000
    depends_on:
      product-db:
        condition: service_healthy
    # 127.0.0.1 namesto localhost: uvicorn posluša na IPv4, localhost v alpine kaže na IPv6.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    mem_limit: 256m
    restart: unless-stopped

  # Inventory Service (Python). Kličejo ga gateway, machine, sales in monitoring, sam kliče machine in product; zunaj omrežja Compose ni dosegljiv.
  inventory-service:
    build: ./backend/inventory-service
    environment:
      DATABASE_URL: postgresql+psycopg://inventory:${INVENTORY_DB_PASSWORD:?Nastavi INVENTORY_DB_PASSWORD v .env}@inventory-db:5432/inventory
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:?Nastavi GATEWAY_SERVICE_TOKEN v .env}
      MACHINE_SERVICE_TOKEN: ${MACHINE_SERVICE_TOKEN:?Nastavi MACHINE_SERVICE_TOKEN v .env}
      SALES_SERVICE_TOKEN: ${SALES_SERVICE_TOKEN:?Nastavi SALES_SERVICE_TOKEN v .env}
      MONITORING_SERVICE_TOKEN: ${MONITORING_SERVICE_TOKEN:?Nastavi MONITORING_SERVICE_TOKEN v .env}
      INVENTORY_SERVICE_TOKEN: ${INVENTORY_SERVICE_TOKEN:?Nastavi INVENTORY_SERVICE_TOKEN v .env}
      MACHINE_URL: http://machine-service:8000
      PRODUCT_URL: http://product-service:8000
    depends_on:
      inventory-db:
        condition: service_healthy
    # 127.0.0.1 namesto localhost: uvicorn posluša na IPv4, localhost v alpine kaže na IPv6.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    mem_limit: 256m
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # VZOREC (komentiran): blok komponente. Vsaka komponenta ga prekopira v svojem PR.
  # Pravila:
  #  - med storitvami ni `depends_on`; komponenta počaka samo na zdravo LASTNO bazo;
  #  - komponenta dobi samo svoje spremenljivke (brez `env_file` celotnega .env);
  #  - omejitev pomnilnika: Python in Node 256m, Java 512m;
  #  - `restart: unless-stopped`;
  #  - preverjanje zdravja na /health/ready, komponenta posluša na vratih 8000 (samo znotraj omrežja);
  #  - gateway (8080) in frontend (5173) objavita vrata v svojih issueh.
  #
  # ---------------------------------------------------------------------------

volumes:
  machine-db-data:
  monitoring-db-data:
  product-db-data:
  inventory-db-data:
  sales-db-data:
  gateway-db-data:
